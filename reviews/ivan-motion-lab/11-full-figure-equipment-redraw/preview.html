<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伊万装备整图重绘 · 比例审阅</title><style>
*{box-sizing:border-box}body{margin:0;background:#222720;color:#ece5d7;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 10px}p{color:#c1c5b8}.note{border-left:3px solid #c7a36b;padding:10px;background:#30362c}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0;align-items:center}select,button{font:inherit;color:#f0ebdf;background:#394434;border:1px solid #819077;border-radius:5px;padding:8px}label{display:flex;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.figure{position:relative;aspect-ratio:7/9;background:#45423d}.figure img{position:absolute;width:100%;height:100%;object-fit:contain;inset:0}.figure .overlay{opacity:.28;display:none;pointer-events:none}figure{margin:0}figcaption{margin:0 0 8px}#phase{color:#e0bb7d}#error{color:#ffb09c}small{color:#c3c4b5}@media(max-width:700px){main{padding:12px}.grid{gap:8px}figcaption{font-size:13px}}
</style><main><h1>伊万装备整图重绘 · 比例审阅</h1><p class="note">基础 24 张保持原样。右侧每一帧都是 AI 画出的完整人物，只做分格裁切、整图等比缩放与对齐；没有拼接头、上身、手臂或腿。本页是审阅稿，尚未覆盖游戏素材。</p><div class="controls"><select id="kind"><option value="masked">防毒面具</option><option value="armed">持枪</option><option value="masked_armed">面具持枪</option></select><select id="direction"><option value="01-front">正面</option><option value="02-front-right">右前</option><option value="03-right">右侧</option><option value="04-back-right">右后</option><option value="05-back">背面</option><option value="06-back-left">左后</option><option value="07-left">左侧</option><option value="08-front-left">左前</option></select><button id="play">播放循环</button><button id="next">下一帧</button><select id="manual"><option value="standing">站姿</option><option value="A">迈步 A</option><option value="B">迈步 B</option></select><label>帧间隔<input id="speed" type="range" min="100" max="600" value="240"></label><label><input id="overlay" type="checkbox">叠加基础图作比例参照</label><span id="phase"></span></div><div class="grid"><figure><figcaption>已认可的基础动作</figcaption><div class="figure"><img id="base" alt="基础人物帧"></div></figure><figure><figcaption>AI 完整人物装备稿</figcaption><div class="figure"><img id="new" alt="装备人物帧"><img id="ghost" class="overlay" alt="仅用于审阅的基础参照"></div></figure></div><p id="error"></p><p>可逐帧比较头部大小、肩宽、腰身、腿长、靴子落点，以及循环中是否忽胖忽瘦。叠加只影响本页显示，不会修改任何图片文件。A—站姿—B—站姿依次播放，两步使用相同显示时长。</p><small>图中的面具会自然覆盖面部并略微增加外轮廓；应比较头骨／头发、躯干和腿部的实际比例。完整人物原画与来源清单均另行保留。</small></main><script>
const IMAGES={};
const ids=['A','standing','B','standing'];let running=false,index=1,last=0;
const $=id=>document.getElementById(id);function file(style,key,phase){const p=style+'/'+key+'-'+phase+'.png';return IMAGES[p]||'frames/'+p}
function render(phase){const kind=$('kind').value,key=$('direction').value;$('base').src=file('base',key,phase);$('new').src=file(kind,key,phase);$('ghost').src=file('base',key,phase);$('ghost').style.display=$('overlay').checked?'block':'none';$('manual').value=phase;$('phase').textContent=phase==='standing'?'站姿':('迈步 '+phase);window.reviewState={kind,key,phase,running,gameModified:false};}
function pause(){running=false;$('play').textContent='播放循环'}
$('play').onclick=()=>{running=!running;$('play').textContent=running?'暂停':'播放循环'};$('next').onclick=()=>{pause();index=(index+1)%4;render(ids[index])};$('manual').onchange=()=>{pause();index=ids.indexOf($('manual').value);render(ids[index])};$('kind').onchange=$('direction').onchange=()=>render(ids[index]);$('overlay').onchange=()=>render(ids[index]);
for(const id of ['base','new'])$(id).onerror=()=>{$('error').textContent='图片未加载：请完整解压审阅包后打开本页。'};
window.setReviewFrame=(kind,key,phase)=>{pause();$('kind').value=kind;$('direction').value=key;index=ids.indexOf(phase);render(phase)};
function tick(t){if(running&&t-last>Number($('speed').value)){last=t;index=(index+1)%4;render(ids[index])}requestAnimationFrame(tick)}render('standing');requestAnimationFrame(tick);window.reviewReady=true;
</script></html>
